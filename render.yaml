services:
  # 1. FastAPI + Machine Learning Backend
  - type: web
    name: thermo-opt-ai-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. React + Vite Frontend Static Site (Served globally on Render CDN)
  - type: web
    name: thermo-opt-ai-frontend
    runtime: static
    plan: free
    branch: main
    buildCommand: cd frontend && npm install && VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://${BACKEND_HOST}.onrender.com}" npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: thermo-opt-ai-backend
          property: host
